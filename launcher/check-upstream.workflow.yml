name: Check Amethyst upstream

on:
  schedule:
    - cron: '23 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check latest upstream release
        shell: pwsh
        run: ./launcher/Check-AmethystUpstream.ps1
